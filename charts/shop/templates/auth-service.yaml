{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: npd-shop
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npd-shop
        app.kubernetes.io/component: auth-service
        istio.io/dataplane-mode: ambient
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | toString }}"
          imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          env:
            {{- range $k, $v := .Values.authService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "shop.secretEnv" . | nindent 12 }}
          {{- include "shop.httpProbes" (dict "path" "/health") | nindent 10 }}
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  selector:
    app.kubernetes.io/name: npd-shop
    app.kubernetes.io/component: auth-service
  ports:
    - name: http
      port: {{ .Values.authService.service.port }}
      targetPort: http
{{- end }}
