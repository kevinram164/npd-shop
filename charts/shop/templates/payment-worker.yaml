{{- if .Values.paymentWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-worker
spec:
  replicas: {{ .Values.paymentWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: npd-shop
      app.kubernetes.io/component: payment-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npd-shop
        app.kubernetes.io/component: payment-worker
        istio.io/dataplane-mode: ambient
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: payment-worker
      {{- include "shop.kafkaVolumes" . | nindent 6 }}
      containers:
        - name: payment-worker
          image: "{{ .Values.paymentWorker.image.repository }}:{{ .Values.paymentWorker.image.tag | toString }}"
          imagePullPolicy: {{ .Values.paymentWorker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8004
          env:
            {{- range $k, $v := .Values.paymentWorker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "shop.secretEnv" . | nindent 12 }}
          {{- include "shop.kafkaVolumeMounts" . | nindent 10 }}
          {{- include "shop.httpProbes" (dict "path" "/health") | nindent 10 }}
          resources:
            {{- toYaml .Values.paymentWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-worker
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: payment-worker
spec:
  selector:
    app.kubernetes.io/name: npd-shop
    app.kubernetes.io/component: payment-worker
  ports:
    - name: http
      port: {{ .Values.paymentWorker.service.port }}
      targetPort: http
{{- end }}
