# ExternalSecret + DB init — sync sau khi đã seed Vault (xem DEPLOY.md / scripts/vault-seed-npd-shop.sh)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: npd-shop-eso-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: npd-shop
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: npd-shop-platform
  source:
    repoURL: https://github.com/kevinram164/npd-shop.git
    targetRevision: main
    path: deploy/vault/external-secrets
    directory:
      include: "{app-external-secret.yaml,harbor-pull-external-secret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: npd-shop
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: npd-shop-eso-noli-db
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: npd-shop
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: npd-shop-platform
  source:
    repoURL: https://github.com/kevinram164/npd-shop.git
    targetRevision: main
    path: deploy/vault/external-secrets
    directory:
      include: noli-db-external-secret.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: npd-shop-db-init
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: npd-shop
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: npd-shop-platform
  source:
    repoURL: https://github.com/kevinram164/npd-shop.git
    targetRevision: main
    path: deploy/postgres
    directory:
      include: noli-db-init-job.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
