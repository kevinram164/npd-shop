# Tạo DB/user noli trên Postgres HA *dùng chung* (không đụng banking/movie)
# Admin: Secret postgres-ha-postgresql (đã có trên cluster)
# Password user noli: Secret npd-shop-noli-db (Vault → ESO), key password
apiVersion: batch/v1
kind: Job
metadata:
  name: noli-db-init
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: npd-shop
    app.kubernetes.io/component: db-init
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: docker.io/bitnamilegacy/postgresql:16.4.0-debian-12-r9
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ha-postgresql
                  key: postgres-password
            - name: NOLI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: npd-shop-noli-db
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              HOST=postgres-ha-postgresql-primary.postgres.svc.cluster.local
              PASS_SQL=${NOLI_PASSWORD//\'/\'\'}
              psql -h "$HOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
                "DO \$\$ BEGIN
                   IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'noli') THEN
                     CREATE ROLE noli LOGIN PASSWORD '${PASS_SQL}';
                   ELSE
                     ALTER ROLE noli WITH LOGIN PASSWORD '${PASS_SQL}';
                   END IF;
                 END \$\$;"
              psql -h "$HOST" -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='noli'" | grep -q 1 \
                || psql -h "$HOST" -U postgres -d postgres -c "CREATE DATABASE noli OWNER noli;"
              psql -h "$HOST" -U postgres -d noli -c "GRANT ALL ON SCHEMA public TO noli;"
              echo "noli database ready (shared postgres-ha; banking/movie untouched)"
