# DB/user noli trên postgres-ha dùng chung (PreSync Job, idempotent).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noli-db-init
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: npd-shop
    app.kubernetes.io/component: db-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: npd-shop
  source:
    repoURL: https://github.com/kevinram164/npd-shop.git
    targetRevision: main
    path: deploy/dev-k8s/manifests/db-init
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
