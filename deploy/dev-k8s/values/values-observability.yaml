# OTEL → opentelemetry-collector.observability (dev-k8s)
gateway:
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_SERVICE_NAME: "noli-shop-gateway"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev-k8s,k8s.namespace.name=npd-shop,k8s.cluster.name=npd-k8s"
    OTEL_HEARTBEAT: "1"
    OTEL_HEARTBEAT_SECONDS: "3600"
    SILENCE_PROBE_ACCESS_LOGS: "true"
    UVICORN_ACCESS_LOG: "off"
    LOG_BUSINESS_JSON: "true"

