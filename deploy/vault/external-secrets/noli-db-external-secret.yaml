# ESO → Secret npd-shop-noli-db (ns postgres) — CHỈ password user `noli`
# KHÔNG đụng Secret postgres-ha-postgresql (banking/movie đang dùng)
# Vault: secret/npd-shop/noli-db
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: npd-shop-noli-db
  labels:
    app.kubernetes.io/part-of: npd-shop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: npd-shop-noli-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: npd-shop/noli-db
        property: password
    - secretKey: username
      remoteRef:
        key: npd-shop/noli-db
        property: username
    - secretKey: database
      remoteRef:
        key: npd-shop/noli-db
        property: database
