# ESO → Secret npd-shop-secrets (ns npd-shop)
# Vault: secret/npd-shop/app
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: npd-shop-secrets
  labels:
    app.kubernetes.io/part-of: npd-shop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: npd-shop-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: npd-shop/app
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: npd-shop/app
        property: JWT_SECRET
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: npd-shop/app
        property: INTERNAL_TOKEN
