# Wire npd-shop → shared Strimzi Kafka (lab plain :9092).
# Bật qua deploy/argocd/npd-shop.yaml valueFiles.
#
# Lab hiện tại: plain listener, không ACL — không cần secret SCRAM.
# Gần prod (values-prod Kafka): đổi sang :9093 + SCRAM từ secret npd-shop (ns kafka).

orderService:
  env:
    KAFKA_BOOTSTRAP: "npd-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    KAFKA_ORDERS_TOPIC: "orders.events"
    KAFKA_PAYMENTS_TOPIC: "payments.events"

paymentWorker:
  env:
    KAFKA_BOOTSTRAP: "npd-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    KAFKA_ORDERS_TOPIC: "orders.events"
    KAFKA_PAYMENTS_TOPIC: "payments.events"
